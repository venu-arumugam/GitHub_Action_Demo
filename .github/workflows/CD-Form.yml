name: CD - Deploy

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which application"
        type: choice
        options: [SparkMDP, MDPAutoFileUpload]
        default: SparkMDP
      version:
        description: "Version to deploy (e.g. 1.4.2). For rollback, enter an older version."
        required: true
        default: "1.4.2"
      environment:
        description: "Target environment"
        type: choice
        options: [test, prod]     
        default: prod
      site:
        description: "Which site"
        type: choice
        options: [pom, dkr, mex, suz, ziyang]
        default: pom
      lines:
        description: "Lines: 'all' or a comma list like line1,line3"
        default: "all"
        required: true
      rollout:
        description: "canary = one line first then rest | all = every chosen line at once"
        type: choice
        options: [canary, all]
        default: canary

jobs:
  deploy:
    # DEMO: run 
    # [self-hosted, deploy, "${{ inputs.site }}"]
    runs-on: ubuntu-latest

    # APPROVER GATE
    # Binds to a GitHub Environment of this name. Add yourself as a Required
    # reviewer on the 'prod' environment (repo Settings -> Environments -> prod),
    # and choosing prod makes this job PAUSE and email you before it continues.
    environment: ${{ inputs.environment }}

    steps:
      - name: Show what will happen (selected options)
        shell: bash
        run: |
          {
            echo "## Deployment request (DRY RUN — nothing was deployed)"
            echo ""
            echo "| Field | Selected |"
            echo "|---|---|"
            echo "| Application | ${{ inputs.app }} |"
            echo "| Version     | ${{ inputs.version }} |"
            echo "| Environment | ${{ inputs.environment }} |"
            echo "| Site        | ${{ inputs.site }} |"
            echo "| Lines       | ${{ inputs.lines }} |"
            echo "| Rollout     | ${{ inputs.rollout }} |"
            echo ""
            echo "> Demonstration only. No machine was contacted and nothing was installed."
          } >> "$GITHUB_STEP_SUMMARY"

      
      - name: Resolve target machines (dry run)
        id: target
        shell: bash
        run: |
          SITE="${{ inputs.site }}"
          LINES="${{ inputs.lines }}"
          if [ "$LINES" = "all" ]; then
            LIMIT="$SITE"
          else
            LIMIT=$(echo "$LINES" | tr ',' '\n' | sed "s/^/${SITE}-/" | paste -sd, -)
          fi
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"
          echo "Would target: $LIMIT"
          echo "Would use inventory: ansible/inventory/${{ inputs.environment }}.ini"

      # ============================================================
      #  ANSIBLE TRIGGER 
      # - name: Deploy (Ansible trigger)
      #   shell: pwsh
      #   run: |
      #     $serial = if ("${{ inputs.rollout }}" -eq "canary") { "1" } else { "0" }
      #     ansible-playbook `
      #       -i "${{ steps.target.outputs.inv }}" `
      #       --limit "${{ steps.target.outputs.limit }}" `
      #       ansible/playbooks/deploy_service.yml `
      #       -e "app_name=${{ inputs.app }}" `
      #       -e "app_version=${{ inputs.version }}" `
      #       -e "package_path=./package/${{ inputs.app }}-${{ inputs.version }}.msi" `
      #       -e "environment_name=${{ inputs.environment }}" `
      #       -e "serial_count=$serial"
      # ============================================================

      - name: Deploy (DRY RUN — Ansible not called)
        shell: bash
        run: |
          echo "DRY RUN — would deploy ${{ inputs.app }} ${{ inputs.version }}"
          echo "  to site '${{ inputs.site }}', lines '${{ steps.target.outputs.limit }}', rollout '${{ inputs.rollout }}'"
          echo "  in environment '${{ inputs.environment }}'."
          echo ""
          echo "In the real workflow this step runs Ansible over WinRM as the gMSA."
          echo "Here it does nothing — safe for a demo."

      - name: Done
        shell: bash
        run: echo "Demo run finished. Nothing was deployed."